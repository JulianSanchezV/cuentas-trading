<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cuentas Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f1f3f7; --surface:#ffffff; --ink:#18203a; --muted:#5d6682; --line:#dde1eb; --soft:#e8ebf3;
  --accent:#3346b8; --accent-ink:#ffffff; --pos:#197a4b; --neg:#b73a32; --admin:#7a4f0e; --admin-bg:#fbf3e3;
  --c1:#3346b8; --c2:#c07a12; --c3:#1f8a86; --c4:#8a4aa8; --c5:#b8465f; --c6:#4f7a1e;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#10131f; --surface:#181c2c; --ink:#e4e8f5; --muted:#99a1bd; --line:#2a3048; --soft:#212741;
  --accent:#8b9cff; --accent-ink:#10131f; --pos:#5fd39a; --neg:#f28a80; --admin:#e8b04e; --admin-bg:#2a2414;
  --c1:#8b9cff; --c2:#e8b04e; --c3:#5cc9c3; --c4:#c796e2; --c5:#ec8aa0; --c6:#a3d468; color-scheme:dark } }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
[hidden]{display:none!important}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.05rem} h3{font-size:.95rem}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section{display:grid;gap:10px}
.head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.status{font-size:.85rem;color:var(--muted)}
.badge{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--admin);background:var(--admin-bg);border:1px solid var(--admin);padding:3px 9px;border-radius:999px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .dotc{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--pos);margin-left:6px;vertical-align:middle}

.totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px}
.totals > div{padding:14px 16px;display:grid;gap:2px;min-width:0}
.totals > div + div{border-left:1px solid var(--line)}
.totals .big{font-size:1.25rem;font-weight:500;overflow-wrap:anywhere}
.totals .sub{font-size:.78rem;color:var(--muted)}
@media (max-width:520px){.totals{grid-template-columns:1fr 1fr}.totals > div:nth-child(3){grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}}

.people{display:grid;gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:8px 14px;align-items:center}
.person .name{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.22rem;text-transform:uppercase;letter-spacing:.04em;min-width:0;overflow-wrap:anywhere}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.person .cell{display:grid;gap:1px;text-align:right;min-width:0}
.person .cell .v{font-size:.98rem;overflow-wrap:anywhere}
.sub{font-size:.72rem;color:var(--muted)}
.bar{grid-column:1/-1;height:5px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px;border-top:1px dashed var(--line)}
.sbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:5px 10px;font-size:.84rem;font-weight:600;cursor:pointer}
.sbtn.add{color:var(--accent)} .sbtn.rm{color:var(--muted);margin-left:auto}
.sbtn.rm:hover{color:var(--neg);border-color:var(--neg)}
.inline{grid-column:1/-1;background:var(--soft);border-radius:9px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;align-items:end}
.inline p{grid-column:1/-1;margin:0;font-size:.88rem}
@media (max-width:640px){.person{grid-template-columns:repeat(3,minmax(0,1fr))}.person .name{grid-column:1/-1}.person .cell{text-align:left}}

.admin{background:var(--admin-bg);border:1px solid var(--admin);border-radius:14px;padding:16px;display:grid;gap:16px}
.admin .block{display:grid;gap:8px}
.admin .block + .block{border-top:1px solid var(--line);padding-top:14px}
.admin .note{margin:0;font-size:.86rem;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=date],input[type=password],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--neg);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.preview{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:6px 22px}
.preview:empty{display:none}
.msg{font-size:.85rem;min-height:1.2em;margin:0}
.dlbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.dlbar .btn{display:inline-flex;align-items:center;gap:8px}
.openrows{display:grid;gap:8px}
.openrow.gone{opacity:.5}
.openrow.gone .who{text-decoration:line-through}
.xbtn{border:1px solid var(--line);background:transparent;border-radius:7px;padding:6px 10px;font-size:.82rem;font-weight:600;cursor:pointer;color:var(--muted)}
.xbtn:hover{color:var(--neg);border-color:var(--neg)}
.openrow{display:grid;grid-template-columns:minmax(90px,1fr) minmax(0,1.2fr) minmax(0,1.2fr) auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.openrow .who{font-weight:600;overflow-wrap:anywhere}
.openrow .who small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
@media (max-width:520px){.openrow{grid-template-columns:1fr 1fr auto}.openrow .who{grid-column:1/-1}}

.hist{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.pill{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--soft);white-space:nowrap}
.pill.g{color:var(--pos)} .pill.a{color:var(--accent)} .pill.r{color:var(--neg)} .pill.i{color:var(--muted)}
.item .what{min-width:0}
.item .what small{display:block;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.item .amt{text-align:right;white-space:nowrap}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.8rem}
.del:hover{color:var(--neg)}
.del.sure{color:var(--neg);font-weight:700}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.hist .empty{border:0;border-radius:0}

footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.link{border:0;background:transparent;color:var(--muted);font-size:.82rem;cursor:pointer;text-decoration:underline;padding:4px}
.login{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.login p{margin:0;font-size:.86rem;color:var(--muted);max-width:65ch}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div style="display:grid;gap:4px">
      <h1>Cuentas Trading</h1>
      <span class="status" id="status">Cargando…</span>
    </div>
    <span class="badge" id="badge" hidden>Modo administrador</span>
  </header>

  <!-- Panel de administración: solo visible con la clave de GitHub -->
  <section class="admin" id="admin" hidden aria-label="Panel de administración"></section>

  <nav class="tabs" id="tabs" aria-label="Meses"></nav>

  <div class="dlbar" id="dlbar" hidden>
    <span class="status" id="dlNote"></span>
    <button class="btn" id="dlBtn" type="button">Descargar resumen (Excel)</button>
  </div>

  <div class="totals" id="totals" aria-label="Totales"></div>

  <section aria-label="Socios">
    <h2 id="peopleTitle">Socios</h2>
    <div class="people" id="people"></div>
  </section>

  <section aria-label="Movimientos">
    <h2 id="histTitle">Movimientos del mes</h2>
    <div class="hist" id="hist"></div>
  </section>

  <section class="login" id="login" hidden aria-label="Entrar como administrador">
    <h3>Entrar como administrador</h3>
    <p>Pega tu clave de GitHub (token con permiso de escritura sobre este repositorio). Se guarda solo en este navegador.</p>
    <div class="row">
      <div class="field"><label for="lRepo">Repositorio (usuario/nombre)</label><input id="lRepo" type="text" placeholder="usuario/repositorio"></div>
      <div class="field"><label for="lToken">Clave de GitHub</label><input id="lToken" type="password" autocomplete="off"></div>
      <button class="btn" id="lGo" type="button">Entrar</button>
    </div>
    <p class="msg" id="lMsg"></p>
  </section>

  <footer>
    <button class="link" id="adminLink" type="button">Administrar</button>
    <button class="link" id="logout" type="button" hidden>Salir del modo administrador</button>
  </footer>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const FILE='datos.json';
  const COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)'];
  const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const capMonths=t=>String(t).replace(/\b(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/g,w=>w[0].toUpperCase()+w.slice(1));
  const MES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

  let data={personas:[],movs:[],meses:[]}, sha=null, token=null, repo=null, busy=false, open=null, tab=null, newRows=[], goneSet=new Set();
  const isAdmin=()=>!!token;

  /* ---------- formato ---------- */
  const nf=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
  const nf2=new Intl.NumberFormat('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2});
  const cop=n=>(n<0?'−':'')+'$'+nf.format(Math.abs(Math.round(n)));
  const scop=n=>(n<0?'−':'+')+'$'+nf.format(Math.abs(Math.round(n)));
  const usd=n=>'US$'+nf2.format(n);
  const pct=n=>nf2.format(n*100)+'%';
  const parseInt0=s=>{const d=String(s||'').replace(/[^\d]/g,'');return d?parseInt(d,10):NaN;};
  function parseDec(s){
    s=String(s||'').replace(/[^\d.,]/g,''); if(!s) return NaN;
    const lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
    if(lc>-1&&ld>-1) s= lc>ld ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
    else if(lc>-1){ const p=s.split(','); s=(p.length>2||p[1].length===3)?s.replace(/,/g,''):s.replace(',','.'); }
    else if(ld>-1){ const p=s.split('.'); if(p.length>2||p[1].length===3) s=s.replace(/\./g,''); }
    return parseFloat(s);
  }
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fdate=s=>{if(!s)return '';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y;};
  const today=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
  const mLong=m=>{const[y,mm]=m.split('-');return MESES[+mm-1]+' '+y;};
  const mCap=m=>{const s=mLong(m);return s[0].toUpperCase()+s.slice(1);};
  const mShort=m=>{const[y,mm]=m.split('-');return MES3[+mm-1]+' '+y;};
  const mNext=m=>{let[y,mm]=m.split('-').map(Number);mm++;if(mm>12){mm=1;y++;}return y+'-'+String(mm).padStart(2,'0');};

  /* ---------- repositorio ---------- */
  function guessRepo(){
    const h=location.hostname, m=h.match(/^([^.]+)\.github\.io$/i);
    if(!m) return null;
    const seg=location.pathname.split('/').filter(Boolean)[0];
    return m[1]+'/'+(seg&&!seg.includes('.')?seg:h);
  }
  const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
  const b64enc=s=>{const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r);};
  const api=p=>'https://api.github.com/repos/'+repo+'/contents/'+p;

  async function loadPublic(){
    const r0=repo||guessRepo();
    if(r0){
      try{
        const r=await fetch('https://api.github.com/repos/'+r0+'/contents/'+FILE,{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'});
        if(r.ok) return await r.json();
      }catch(e){}
    }
    const r=await fetch(FILE+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('no-file');
    return await r.json();
  }
  async function loadAdmin(){
    const r=await fetch(api(FILE)+'?t='+Date.now(),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'},cache:'no-store'});
    if(r.status===401||r.status===403) throw new Error('auth');
    if(r.status===404) throw new Error('404');
    if(!r.ok) throw new Error('http');
    const j=await r.json(); sha=j.sha;
    return JSON.parse(b64dec(j.content));
  }
  /* Normaliza y migra: cada movimiento pertenece a un mes (YYYY-MM) */
  function norm(d){
    const personas=Array.isArray(d&&d.personas)?d.personas:[];
    const movs=(Array.isArray(d&&d.movs)?d.movs:[]).map(m=>({...m,mes:m.mes||(m.fecha||'').slice(0,7)}));
    const set=new Set(Array.isArray(d&&d.meses)?d.meses:[]);
    movs.forEach(m=>m.mes&&set.add(m.mes));
    return {personas,movs,meses:[...set].sort()};
  }

  async function save(mutate,okText,msgEl){
    if(busy) return false;
    busy=true; setStatus('Guardando…');
    const next=JSON.parse(JSON.stringify(data)); mutate(next);
    next.meses=[...new Set(next.meses)].sort();
    try{
      const body={message:okText||'Actualizar datos',content:b64enc(JSON.stringify(next,null,2)+'\n'),sha};
      const r=await fetch(api(FILE),{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
      if(r.status===409||r.status===422){
        data=norm(await loadAdmin()); render();
        flash(msgEl,'Los datos cambiaron en GitHub. Se recargaron; repite la acción.',true); setStatus(''); return false;
      }
      if(r.status===401||r.status===403){ flash(msgEl,'La clave no tiene permiso de escritura. Revisa el token.',true); setStatus(''); return false; }
      if(!r.ok) throw new Error('http');
      const j=await r.json(); sha=j.content.sha; data=norm(next);
      setStatus('Guardado. Los demás lo ven al recargar.');
      render(); flash($(msgEl&&msgEl.id)||msgEl,(okText||'Guardado')+'. Guardado en GitHub.'); return true;
    }catch(e){ flash(msgEl,'No se pudo guardar. Revisa tu conexión e intenta de nuevo.',true); setStatus(''); return false; }
    finally{ busy=false; }
  }

  /* ---------- cálculo por mes ---------- */
  const capMovs=()=>data.movs.filter(m=>m.tipo==='aporte'||m.tipo==='retiro').sort((a,b)=>a.mes<b.mes?-1:a.mes>b.mes?1:(a.creado||0)-(b.creado||0));
  function capAt(mes){ // capital de cada persona en ese mes
    const P={};
    for(const m of capMovs()){ if(m.mes>mes) break; P[m.persona]=(P[m.persona]||0)+(m.tipo==='aporte'?m.monto:-m.monto); }
    return P;
  }
  const gainsOf=mes=>data.movs.filter(m=>m.tipo==='ganancia'&&m.mes===mes).sort((a,b)=>(a.fecha||'')<(b.fecha||'')?-1:(a.fecha||'')>(b.fecha||'')?1:(a.creado||0)-(b.creado||0));
  const byDate=(a,b)=>(a.fecha||'')<(b.fecha||'')?-1:(a.fecha||'')>(b.fecha||'')?1:(a.creado||0)-(b.creado||0);
  const trmEvents=mes=>data.movs.filter(m=>(m.tipo==='ganancia'||m.tipo==='trm')&&m.mes===mes&&m.trm>0).sort(byDate);
  function trmOf(mes){ const e=trmEvents(mes); return e.length?e[e.length-1]:null; }
  function monthInfo(mes){
    const P=capAt(mes), ns=Object.keys(P).filter(n=>P[n]>0).sort((a,b)=>P[b]-P[a]||a.localeCompare(b)), C=ns.reduce((a,n)=>a+P[n],0);
    const i=data.meses.indexOf(mes), prev=i>0?data.meses[i-1]:null, PP=prev?capAt(prev):{};
    const gs=gainsOf(mes), gUsd=gs.reduce((a,g)=>a+(g.usd||0),0), te=trmOf(mes), trm=te?te.trm:0;
    const gCop=Math.round(gUsd*trm), parts={}, partsUsd={};
    if(C>0) ns.forEach(n=>{ partsUsd[n]=gUsd*P[n]/C; parts[n]=partsUsd[n]*trm; });
    return {mes,P,ns,C,prev,PP,gs,gCop,gUsd,parts,partsUsd,trm,te};
  }
  const lastMes=()=>data.meses[data.meses.length-1]||null;
  const personOrder=()=>[...data.personas].sort((a,b)=>(a.creado||0)-(b.creado||0));
  const colorOf=n=>{const i=personOrder().findIndex(p=>p.nombre===n);return COLORS[(i<0?0:i)%COLORS.length];};
  const activos=()=>personOrder().filter(p=>p.activo!==false);
  const byCap=(list,P)=>list.sort((a,b)=>((P[b.nombre]||0)-(P[a.nombre]||0))||a.nombre.localeCompare(b.nombre));
  const sumOf=P=>Object.values(P).reduce((a,v)=>a+Math.max(0,v),0);
  function capHistory(mes){ // movimientos de capital del mes con antes/después
    const run={}; for(const m of capMovs()){ if(m.mes>=mes) break; run[m.persona]=(run[m.persona]||0)+(m.tipo==='aporte'?m.monto:-m.monto); }
    return capMovs().filter(x=>x.mes===mes).map(m=>{
      const a=run[m.persona]||0, b=a+(m.tipo==='aporte'?m.monto:-m.monto); run[m.persona]=b;
      return {m,a,b,why:m.nota?capMonths(m.nota):(a===0?'Inversión inicial':(m.tipo==='aporte'?'Aporte':'Retiro')+' al inicio de '+mLong(mes))};
    });
  }

  /* ---------- pintar ---------- */
  function setStatus(t){ $('status').textContent=t||(isAdmin()?'Estás editando. Cada cambio se guarda en GitHub.':'Cada mes se reparte la ganancia según lo que cada uno tenía invertido ese mes.'); }
  function flash(el,t,bad){ if(!el) return; el.textContent=t; el.className='msg '+(bad?'neg':'pos'); }

  function render(){
    const adm=isAdmin();
    $('badge').hidden=!adm; $('logout').hidden=!adm; $('adminLink').hidden=adm; if(adm) $('login').hidden=true;
    if(!tab||(tab!=='total'&&!data.meses.includes(tab))) tab=lastMes()||'total';
    const last=lastMes();
    $('tabs').innerHTML=data.meses.map(m=>`<button class="tab" type="button" data-tab="${m}" aria-selected="${tab===m}">${mShort(m)}${m===last?'<span class="dotc" title="Mes en curso"></span>':''}</button>`).join('')
      +(data.meses.length?`<button class="tab" type="button" data-tab="total" aria-selected="${tab==='total'}">Total</button>`:'');
    $('dlbar').hidden=!(tab&&tab!=='total');
    if(tab&&tab!=='total'){ $('dlBtn').textContent='Descargar resumen de '+mLong(tab)+' (Excel)'; $('dlNote').textContent=tab===last?'Mes en curso: el archivo incluye lo registrado hasta hoy.':'Mes cerrado.'; }
    renderAdmin();
    if(tab==='total') renderTotal(); else renderMonth(tab);
  }
  $('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]'); if(!b) return; tab=b.dataset.tab; open=null; render();});

  function renderMonth(mes){
    if(!mes){ $('totals').innerHTML=''; $('people').innerHTML=`<div class="empty">${isAdmin()?'Agrega el primer socio desde el panel de arriba.':'Todavía no hay socios registrados.'}</div>`; $('hist').innerHTML='<div class="empty">Aún no hay registros.</div>'; $('peopleTitle').textContent='Socios'; $('histTitle').textContent='Movimientos'; return; }
    const {P,C,prev,PP,gs,gCop,gUsd,parts,partsUsd,trm,te}=monthInfo(mes), adm=isAdmin(), editable=adm&&mes===lastMes()&&!gs.length, isCur=mes===lastMes();

      <div><span class="lbl">Capital de ${mLong(mes)}</span><span class="big num">${cop(C)}</span></div>
      <div><span class="lbl">Ganancia del mes</span><span class="big num pos">${gs.length?cop(gCop):'—'}</span><span class="sub num">${gs.length?usd(gUsd)+' × TRM '+nf2.format(trm)+(te&&te.fecha?' ('+fdate(te.fecha)+')':''):'Sin reportes aún'}</span></div>
      <div><span class="lbl">Rendimiento</span><span class="big num">${gs.length&&C>0?pct(gCop/C):'—'}</span><span class="sub">${gs.length?gs.length+(gs.length===1?' reporte':' reportes')+(isCur?' · TRM vigente':' · TRM final'):''}</span></div>`;

    $('people').innerHTML=list.length?list.map(p=>{
      const n=p.nombre, cap=P[n]||0, before=PP[n]||0, sh=C>0?cap/C:0, col=colorOf(n), part=parts[n];
      const chg='';
      let extra='';
      if(editable&&p.activo!==false){
        extra=`<div class="acts"><button class="sbtn add" type="button" data-do="cambiar" data-id="${esc(p.id)}">Cambiar capital de ${mLong(mes).split(' ')[0]}</button><button class="sbtn rm" type="button" data-do="quitar-ask" data-id="${esc(p.id)}">Eliminar persona</button></div>`;
        if(open&&open.id===p.id){
          if(open.mode==='quitar') extra+=`<div class="inline"><p>${esc(n)} sale del fondo desde ${mLong(mes)}${cap>0?' y se registra el retiro de <b class="num">'+cop(cap)+'</b>':''}. Su historial se conserva.</p>
            <button class="btn danger" type="button" data-do="quitar" data-id="${esc(p.id)}">Eliminar persona</button><button class="btn ghost" type="button" data-do="cancel">Cancelar</button><p class="msg" id="iMsg"></p></div>`;
          else extra+=`<div class="inline"><div class="field"><label for="iMonto">Nuevo capital total (COP)</label><input id="iMonto" type="text" class="num money" inputmode="numeric" value="${nf.format(cap)}"></div>
            <button class="btn" type="button" data-do="guardar" data-id="${esc(p.id)}">Guardar</button><button class="btn ghost" type="button" data-do="cancel">Cancelar</button><p class="msg" id="iMsg"></p></div>`;
        }
      }
      return `<div class="person">
        <div class="name"><span class="dot" style="background:${col}"></span>${esc(n)}</div>
        <div class="cell"><span class="lbl">Invertido</span><span class="v num">${cop(cap)}</span>${chg?`<span class="sub num">${chg}</span>`:''}</div>
        <div class="cell"><span class="lbl">Porcentaje</span><span class="v num">${pct(sh)}</span></div>
        <div class="cell"><span class="lbl">Ganancia del mes</span><span class="v num pos">${gs.length&&part!=null?cop(part):'—'}</span>${gs.length&&part!=null&&gUsd?`<span class="sub num">${usd(partsUsd[n])}</span>`:''}</div>
        <div class="bar"><i style="width:${(sh*100).toFixed(2)}%;background:${col}"></i></div>${extra}</div>`;
    }).join(''):'<div class="empty">No hay socios con capital en este mes.</div>';

    $('histTitle').textContent='Movimientos de '+mLong(mes);
    const items=[];
    for(const {m,a,b,why} of capHistory(mes)){
      items.push({m,html:`<span class="pill ${m.tipo==='aporte'?'a':'r'}">${m.tipo==='aporte'?'Aporte':'Retiro'}</span>

        <span class="amt num ${m.tipo==='aporte'?'':'neg'}">${m.tipo==='aporte'?'+':'−'}${cop(m.monto)}</span>`});
    }
    let k=0;
    trmEvents(mes).concat(data.movs.filter(m=>m.tipo==='ganancia'&&m.mes===mes&&!(m.trm>0))).sort(byDate).forEach(g=>{
      if(g.tipo==='trm'){ items.push({m:g,html:`<span class="pill i">TRM</span><div class="what">${g.fecha?fdate(g.fecha)+' · ':''}TRM actualizada a ${nf2.format(g.trm)}<small>Todas las ganancias del mes se convierten con esta TRM</small></div><span class="amt num">${nf2.format(g.trm)}</span>`}); return; }
      k++;
      const det=Object.keys(partsUsd).sort((x,y)=>P[y]-P[x]).map(n=>esc(n)+' '+usd((g.usd||0)*P[n]/C)).join(' · ');
      items.push({m:g,html:`<span class="pill g">Ganancia ${k}</span><div class="what">${g.fecha?fdate(g.fecha)+' · ':''}${usd(g.usd||0)}${g.trm?' · TRM de ese día '+nf2.format(g.trm):''}<small class="num">${det||'Sin capital registrado'}</small></div><span class="amt num pos">${usd(g.usd||0)}</span>`});
    });
    if(gs.length) items.push({m:null,html:`<span class="pill g">Total</span><div class="what">${usd(gUsd)} × TRM ${isCur?'vigente':'final'} ${nf2.format(trm)}<small>El valor en pesos se recalcula con la TRM más reciente del mes</small></div><span class="amt num pos">${cop(gCop)}</span>`});
    $('hist').innerHTML=items.length?items.map(it=>`<div class="item">${it.html}${isAdmin()&&it.m?`<button class="del" type="button" data-del="${esc(it.m.id)}">Borrar</button>`:'<span></span>'}</div>`).join(''):'<div class="empty">Sin movimientos este mes.</div>';
    if(open&&open.mode==='cambiar'){ const i=$('iMonto'); if(i){ i.focus(); i.select(); } }
  }

  function renderTotal(){
    const last=lastMes(), P=last?capAt(last):{}, C=sumOf(P), A={};
    let gTot=0,uTot=0;
    for(const m of data.meses){ const mi=monthInfo(m); gTot+=mi.gCop; uTot+=mi.gUsd; for(const n in mi.parts){ A[n]=A[n]||{cop:0,usd:0}; A[n].cop+=mi.parts[n]; A[n].usd+=mi.partsUsd[n]; } }
    $('totals').innerHTML=`
      <div><span class="lbl">Capital actual</span><span class="big num">${cop(C)}</span><span class="sub">${last?mCap(last):''}</span></div>

    $('people').innerHTML=list.length?list.map(p=>{
      const n=p.nombre, cap=P[n]||0, a=A[n]||{cop:0,usd:0}, col=colorOf(n), sh=C>0?cap/C:0;
      return `<div class="person">
        <div class="name"><span class="dot" style="background:${col}"></span>${esc(n)}</div>
        <div class="cell"><span class="lbl">Capital actual</span><span class="v num">${cop(cap)}</span></div>
        <div class="cell"><span class="lbl">Porcentaje actual</span><span class="v num">${pct(sh)}</span></div>
        <div class="cell"><span class="lbl">Ganancia total</span><span class="v num pos">${cop(a.cop)}</span>${a.usd?`<span class="sub num">${usd(a.usd)}</span>`:''}</div>
        <div class="bar"><i style="width:${(sh*100).toFixed(2)}%;background:${col}"></i></div></div>`;
    }).join(''):'<div class="empty">Todavía no hay socios registrados.</div>';
    $('histTitle').textContent='Ganancia por mes';
    const rows=[...data.meses].reverse().map(m=>{const {gs,C,gCop,gUsd,trm}=monthInfo(m);return `<div class="item"><span class="pill ${gs.length?'g':'i'}">${mShort(m)}</span><div class="what">Capital ${cop(C)}<small class="num">${gs.length?usd(gUsd)+' × TRM '+nf2.format(trm)+' · '+gs.length+(gs.length===1?' reporte':' reportes')+' · rendimiento '+(C>0?pct(gCop/C):'—'):'Sin reportes aún'}</small></div><span class="amt num ${gs.length?'pos':'muted'}">${gs.length?cop(gCop):'—'}</span><span></span></div>`;});
    $('hist').innerHTML=rows.join('')||'<div class="empty">Aún no hay meses.</div>';
  }

  /* ---------- panel de administración ---------- */

    const cur=lastMes(), gs=cur?gainsOf(cur):[];

      h+=`<div class="block"><h3>Empezar: primer mes</h3><p class="note">Elige el mes y agrega a cada socio con lo que invirtió.</p>

      if(gs.length){ const {trm,te,gUsd}=monthInfo(cur);
        h+=`<div class="block"><h3>Actualizar TRM de ${mLong(cur)}</h3>
        <p class="note">TRM vigente: <b class="num">${nf2.format(trm)}</b>${te&&te.fecha?' ('+fdate(te.fecha)+')':''}. Úsalo cuando cambie la TRM sin nueva ganancia, por ejemplo el día del retiro.</p>

    }
    if(!cur||!gs.length){
      h+=`<div class="block"><h3>Agregar persona${cur?' en '+mLong(cur):''}</h3>
        <div class="row">
          <div class="field"><label for="pNombre">Nombre</label><input id="pNombre" type="text"></div>
          <div class="field"><label for="pMonto">Capital (COP)</label><input id="pMonto" type="text" class="num money" inputmode="numeric" placeholder="5.000.000"></div>
          <button class="btn" id="pSave" type="button">Agregar</button>
        </div><p class="msg" id="pMsg"></p></div>`;
    } else {
      h+=`<div class="block"><p class="note">${mCap(cur)} ya tiene ganancias, así que su capital quedó fijo. Los cambios de capital y de socios se hacen al abrir el mes siguiente.</p></div>`;
    }
    if(cur){
      const nx=mNext(cur), P=capAt(cur), act=byCap(activos().filter(p=>(P[p.nombre]||0)>0),P);
      h+=`<div class="block"><h3>Abrir ${mLong(nx)}</h3>
        <p class="note">Para cada socio elige si sigue con el mismo capital o con otro valor. También puedes eliminar socios o agregar nuevos.</p>
        <div class="openrows" id="oRows">${act.map(p=>`<div class="openrow${goneSet.has(p.nombre)?' gone':''}" data-n="${esc(p.nombre)}">
          <div class="who">${esc(p.nombre)}<small class="num">Hoy ${cop(P[p.nombre])}</small></div>
          <select class="oSel" aria-label="Capital de ${esc(p.nombre)}"${goneSet.has(p.nombre)?' disabled':''}><option value="same">Mismo capital</option><option value="new">Otro valor</option></select>
          <input class="oVal num money" type="text" inputmode="numeric" placeholder="Nuevo capital" aria-label="Nuevo capital de ${esc(p.nombre)}" hidden>

          <input class="nVal num money" type="text" inputmode="numeric" placeholder="Capital (COP)" aria-label="Capital del nuevo socio" value="${esc(r.v)}">
          <span class="sub">Nuevo socio</span>
          <button class="xbtn" type="button" data-nrm="${k}">Quitar</button>
        </div>`).join('')}</div>
        <div class="row"><button class="btn ghost" id="oAdd" type="button">+ Agregar socio nuevo</button></div>

      if(data.meses.length>1){

        h+=`<div class="block"><h3>Eliminar ${mLong(cur)}</h3><p class="note">Si creaste ${mLong(cur)} por error, puedes eliminarlo. Se vuelve a ${mLong(data.meses[data.meses.length-2])}.</p>
        <div class="row" id="uAsk"><button class="btn ghost" id="uSave" type="button">Eliminar ${mLong(cur)}</button></div>
        <div class="inline" id="uConfirm" hidden><p><b>¿Seguro que deseas eliminar ${mLong(cur)}?</b> Se borrarán ${nG} ${nG===1?'reporte':'reportes'} de ganancia${nT?', '+nT+' '+(nT===1?'actualización':'actualizaciones')+' de TRM':''} y ${nC} ${nC===1?'cambio':'cambios'} de capital de ese mes. No se puede deshacer.</p>
          <button class="btn danger" id="uYes" type="button">Sí, eliminar ${mLong(cur)}</button><button class="btn ghost" id="uNo" type="button">No, cancelar</button></div>
        <p class="msg" id="uMsg"></p></div>`;
      }
    }
    el.innerHTML=h;
    wireAdmin();
  }

  function wireAdmin(){
    const cur=lastMes();
    if($('uSave')){
      $('uSave').onclick=()=>{ $('uAsk').hidden=true; $('uConfirm').hidden=false; };
      $('uNo').onclick=()=>{ $('uConfirm').hidden=true; $('uAsk').hidden=false; };
      $('uYes').onclick=async()=>{
        $('uYes').disabled=true;
        const gone=new Set(capMovs().filter(x=>x.mes===cur&&x.tipo==='retiro').map(x=>x.persona));
        const ok=await save(d=>{
          d.meses=d.meses.filter(x=>x!==cur);
          d.movs=d.movs.filter(x=>(x.mes||(x.fecha||'').slice(0,7))!==cur);
          const still=new Set(d.movs.filter(x=>x.tipo==='aporte'||x.tipo==='retiro').map(x=>x.persona));
          d.personas=d.personas.filter(p=>still.has(p.nombre));
          d.personas.forEach(p=>{ if(gone.has(p.nombre)) p.activo=true; });
        },mCap(cur)+' eliminado',$('uMsg'));
        if(ok){ tab=lastMes(); newRows=[]; goneSet=new Set(); render(); } else if($('uYes')) $('uYes').disabled=false;
      };
    }
    if($('gSave')){
      const pv=()=>{
        const u=parseDec($('gUsd').value), t=parseDec($('gTrm').value), v=(u>0&&t>0)?Math.round(u*t):NaN;
        if(!(v>0)){ $('gPrev').innerHTML=''; return; }
        const {ns,P,C,gCop,gUsd}=monthInfo(cur), U=gUsd+u, T=Math.round(U*t);
        $('gPrev').innerHTML=`<span>Total del mes: <b class="num">${usd(U)}</b> × ${nf2.format(t)} = <b class="num pos">${cop(T)}</b>${gs0()?` <span class="muted">(antes ${cop(gCop)})</span>`:''}</span>`+(C>0?ns.map(n=>`<span>${esc(n)} (${pct(P[n]/C)}) <b class="num">${cop(T*P[n]/C)}</b> <span class="muted num">${usd(U*P[n]/C)}</span></span>`).join(''):'<span class="muted">No hay capital en este mes.</span>');
      };
      const gs0=()=>gainsOf(cur).length>0;
      ['gUsd','gTrm'].forEach(id=>$(id).addEventListener('input',pv));
      $('gSave').onclick=async()=>{
        const m=$('gMsg'), u=parseDec($('gUsd').value), t=parseDec($('gTrm').value), f=$('gFecha').value;
        if(!(u>0)) return flash(m,'Escribe la ganancia en dólares.',true);
        if(!(t>0)) return flash(m,'Escribe la TRM del día.',true);
        const v=Math.round(u*t); $('gSave').disabled=true;
        const ok=await save(d=>d.movs.push({id:uid(),tipo:'ganancia',mes:cur,fecha:f||today(),usd:u,trm:t,monto:v,creado:Date.now()}),'Ganancia sumada a '+mLong(cur)+': '+usd(u),m);
        if(!ok&&$('gSave')) $('gSave').disabled=false;
      };
    }
    if($('tSave')){
      const {gUsd,gCop}=monthInfo(cur);
      $('tTrm').addEventListener('input',()=>{ const t=parseDec($('tTrm').value); $('tPrev').innerHTML=t>0?`<span>${usd(gUsd)} × ${nf2.format(t)} = <b class="num pos">${cop(gUsd*t)}</b> <span class="muted">(antes ${cop(gCop)})</span></span>`:''; });
      $('tSave').onclick=async()=>{
        const m=$('tMsg'), t=parseDec($('tTrm').value), f=$('tFecha').value;
        if(!(t>0)) return flash(m,'Escribe la nueva TRM.',true);
        $('tSave').disabled=true;
        const ok=await save(d=>d.movs.push({id:uid(),tipo:'trm',mes:cur,fecha:f||today(),trm:t,creado:Date.now()}),'TRM de '+mLong(cur)+' actualizada a '+nf2.format(t),m);
        if(!ok&&$('tSave')) $('tSave').disabled=false;
      };
    }
    if($('pSave')){
      $('pSave').onclick=async()=>{
        const m=$('pMsg'), n=$('pNombre').value.trim(), v=parseInt0($('pMonto').value);
        const mes=cur||($('fMes')&&$('fMes').value.trim());
        if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(mes||'')) return flash(m,'Escribe el mes como AAAA-MM, por ejemplo 2026-09.',true);
        if(!n) return flash(m,'Escribe el nombre.',true);
        if(!(v>0)) return flash(m,'Escribe el capital en pesos.',true);
        const P=capAt(mes);
        if(Object.keys(P).some(k=>k.toLowerCase()===n.toLowerCase()&&P[k]>0)) return flash(m,n+' ya tiene capital en este mes. Usa "Cambiar capital".',true);
        $('pSave').disabled=true;
        const ok=await save(d=>{
          const prev=d.personas.find(p=>p.nombre.toLowerCase()===n.toLowerCase()), name=prev?prev.nombre:n;
          if(prev) prev.activo=true; else d.personas.push({id:uid(),nombre:n,activo:true,creado:Date.now()});
          if(!d.meses.includes(mes)) d.meses.push(mes);
          d.movs.push({id:uid(),tipo:'aporte',persona:name,mes,fecha:today(),monto:v,nota:!capMovs().some(x=>x.persona===name)?'Inversión inicial':'Entra al fondo en '+mLong(mes),creado:Date.now()});
        },'Nueva persona: '+n+' con '+cop(v),m);
        if(!ok&&$('pSave')) $('pSave').disabled=false;
      };
    }
    if($('oSave')){
      const nx=mNext(cur), P=capAt(cur);
      const syncNew=()=>{ document.querySelectorAll('.nrow').forEach(r=>{ const k=+r.dataset.k; newRows[k]={n:r.querySelector('.nName').value,v:r.querySelector('.nVal').value}; }); };
      const collect=()=>{
        const out=[], add=[]; let err=null;
        document.querySelectorAll('.openrow:not(.nrow)').forEach(r=>{
          const n=r.dataset.n, a=P[n]||0;
          if(goneSet.has(n)){ out.push({n,a,b:0}); return; }
          let b=a;
          if(r.querySelector('.oSel').value==='new'){ b=parseInt0(r.querySelector('.oVal').value); if(!(b>0)) err='Escribe el nuevo capital de '+n+' (mayor que cero). Para sacarlo usa "Eliminar".'; }
          out.push({n,a,b});
        });
        syncNew();
        const names=new Set(Object.keys(P).filter(k=>P[k]>0).map(k=>k.toLowerCase()));
        newRows.forEach(r=>{
          const n=(r.n||'').trim(), v=parseInt0(r.v);
          if(!n&&!r.v) return;
          if(!n){ err='Escribe el nombre del nuevo socio.'; return; }
          if(!(v>0)){ err='Escribe el capital de '+n+'.'; return; }
          if(names.has(n.toLowerCase())){ err=n+' ya es socio.'; return; }
          names.add(n.toLowerCase()); add.push({n,b:v});
        });
        return {out,add,err};
      };
      const pv=()=>{
        const {out,add}=collect(), all=[...out.filter(x=>isFinite(x.b)),...add.map(x=>({n:x.n,a:0,b:x.b}))], T=all.reduce((s,x)=>s+x.b,0);
        $('oPrev').innerHTML=all.sort((x,y)=>y.b-x.b).map(x=>`<span>${esc(x.n)}: <b class="num">${cop(x.b)}</b>${x.b!==x.a?` <span class="num ${x.b>x.a?'pos':'neg'}">${x.a===0?'nuevo':x.b===0?'sale':scop(x.b-x.a)}</span>`:''}${T>0&&x.b>0?` <span class="muted num">${pct(x.b/T)}</span>`:''}</span>`).join('')+`<span class="muted">Total ${mLong(nx)} <b class="num">${cop(T)}</b></span>`;
      };
      document.querySelectorAll('.openrow:not(.nrow)').forEach(r=>{
        const s=r.querySelector('.oSel'), i=r.querySelector('.oVal');
        s.addEventListener('change',()=>{ i.hidden=s.value!=='new'; if(!i.hidden){ i.value=nf.format(P[r.dataset.n]||0); i.focus(); i.select(); } pv(); });
        i.addEventListener('input',pv);
      });
      document.querySelectorAll('.nrow input').forEach(i=>i.addEventListener('input',pv));
      $('oRows').addEventListener('click',e=>{
        const g=e.target.closest('[data-gone]'), q=e.target.closest('[data-nrm]');
        if(g){ syncNew(); const n=g.dataset.gone; goneSet.has(n)?goneSet.delete(n):goneSet.add(n); renderAdmin(); }
        if(q){ syncNew(); newRows.splice(+q.dataset.nrm,1); renderAdmin(); }
      });
      $('oAdd').onclick=()=>{ syncNew(); newRows.push({n:'',v:''}); renderAdmin(); const ns=document.querySelectorAll('.nName'); if(ns.length) ns[ns.length-1].focus(); };
      pv();
      $('oSave').onclick=async()=>{
        const m=$('oMsg'), {out,add,err}=collect();
        if(err) return flash(m,err,true);
        if(!out.some(x=>x.b>0)&&!add.length) return flash(m,'El mes debe tener al menos un socio con capital.',true);
        $('oSave').disabled=true;
        const t0=Date.now();
        const ok=await save(d=>{
          d.meses.push(nx);
          out.forEach((x,k)=>{
            if(x.b===x.a) return;
            const diff=x.b-x.a;
            d.movs.push({id:uid(),tipo:diff>0?'aporte':'retiro',persona:x.n,mes:nx,fecha:today(),monto:Math.abs(diff),
              nota:x.b===0?'Sale del fondo en '+mLong(nx):(diff>0?'Aumenta su capital en ':'Reduce su capital en ')+mLong(nx),creado:t0+k});
            if(x.b===0){ const p=d.personas.find(y=>y.nombre===x.n); if(p) p.activo=false; }
          });
          add.forEach((x,k)=>{
            const prev=d.personas.find(p=>p.nombre.toLowerCase()===x.n.toLowerCase()), name=prev?prev.nombre:x.n;
            if(prev) prev.activo=true; else d.personas.push({id:uid(),nombre:x.n,activo:true,creado:t0+100+k});
            d.movs.push({id:uid(),tipo:'aporte',persona:name,mes:nx,fecha:today(),monto:x.b,nota:prev?'Vuelve al fondo en '+mLong(nx):'Entra al fondo en '+mLong(nx),creado:t0+100+k});
          });
        },'Abrir '+mLong(nx),m);
        if(ok){ newRows=[]; goneSet=new Set(); tab=nx; render(); } else if($('oSave')) $('oSave').disabled=false;
      };
    }
  }

  /* ---------- acciones por persona (mes abierto, sin ganancias) ---------- */
  $('people').addEventListener('click',async e=>{
    const b=e.target.closest('[data-do]'); if(!b||!isAdmin()) return;
    const a=b.dataset.do, p=data.personas.find(x=>x.id===b.dataset.id), cur=lastMes();
    if(a==='cancel'){ open=null; render(); return; }
    if(a==='cambiar'){ open={id:p.id,mode:'cambiar'}; render(); return; }
    if(a==='quitar-ask'){ open={id:p.id,mode:'quitar'}; render(); return; }
    const m=$('iMsg'), cap=capAt(cur)[p.nombre]||0;
    if(a==='guardar'){
      const v=parseInt0($('iMonto').value);
      if(!(v>0)) return flash(m,'Escribe el nuevo capital en pesos. Para sacarlo usa "Eliminar persona".',true);
      if(v===cap){ open=null; render(); return; }
      const diff=v-cap; b.disabled=true;
      const ok=await save(d=>d.movs.push({id:uid(),tipo:diff>0?'aporte':'retiro',persona:p.nombre,mes:cur,fecha:today(),monto:Math.abs(diff),
        nota:(diff>0?'Aumenta su capital en ':'Reduce su capital en ')+mLong(cur),creado:Date.now()}),'Capital de '+p.nombre+': '+cop(v),m);
      if(ok){ open=null; render(); } else b.disabled=false;
      return;
    }
    if(a==='quitar'){
      b.disabled=true;
      const ok=await save(d=>{
        if(cap>0) d.movs.push({id:uid(),tipo:'retiro',persona:p.nombre,mes:cur,fecha:today(),monto:cap,nota:'Sale del fondo en '+mLong(cur),creado:Date.now()});
        const x=d.personas.find(y=>y.id===p.id); if(x) x.activo=false;
      },'Sale '+p.nombre,m);
      if(ok){ open=null; render(); } else b.disabled=false;
    }
  });

  $('hist').addEventListener('click',async e=>{
    const b=e.target.closest('[data-del]'); if(!b||!isAdmin()) return;
    if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent='¿Seguro?'; setTimeout(()=>{ if(b.isConnected){b.classList.remove('sure');b.textContent='Borrar';} },3000); return; }
    b.disabled=true;
    const id=b.dataset.del;
    await save(d=>{d.movs=d.movs.filter(x=>x.id!==id);},'Registro borrado',null);
  });

  document.addEventListener('focusout',e=>{ const el=e.target; if(el.classList&&el.classList.contains('money')){ const v=parseInt0(el.value); if(v>=0&&el.value!=='') el.value=nf.format(v); } });

  /* ---------- resumen en Excel (se genera al descargar, con los datos de ese momento) ---------- */
  let xlLib=null;
  function loadExcelJS(){
    if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
    if(xlLib) return xlLib;
    xlLib=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; s.onload=()=>res(window.ExcelJS); s.onerror=()=>{xlLib=null;rej(new Error('lib'));}; document.head.appendChild(s); });
    return xlLib;
  }
  async function buildExcel(mes){
    const ExcelJS=await loadExcelJS();
    const {P,ns,C,prev,PP,gs,gCop,gUsd,parts,partsUsd,trm,te}=monthInfo(mes);
    const wb=new ExcelJS.Workbook(); wb.creator='Cuentas Trading'; wb.created=new Date();
    const ws=wb.addWorksheet(mShort(mes),{views:[{showGridLines:false}],pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0}});
    const NAVY='FF18203A', ACC='FF3346B8', SOFT='FFE8EBF3', LINE='FFDDE1EB', POS='FF197A4B', NEG='FFB73A32', MUT='FF5D6682', WHITE='FFFFFFFF';
    const F_COP='"$"#,##0', F_USD='"US$"#,##0.00', F_PCT='0.00%', F_TRM='#,##0.00';
    const border={top:{style:'thin',color:{argb:LINE}},bottom:{style:'thin',color:{argb:LINE}},left:{style:'thin',color:{argb:LINE}},right:{style:'thin',color:{argb:LINE}}};
    ws.columns=[{width:26},{width:20},{width:16},{width:22},{width:20},{width:18},{width:18}];
    const NC=7;
    const band=(r,text,size,fill,color)=>{ ws.mergeCells(r,1,r,NC); const c=ws.getCell(r,1); c.value=text; c.font={name:'Calibri',size,bold:true,color:{argb:color}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:fill}}; c.alignment={vertical:'middle',horizontal:'left',indent:1}; ws.getRow(r).height=size>14?34:22; };
    const section=(r,text)=>{ ws.mergeCells(r,1,r,NC); const c=ws.getCell(r,1); c.value=text; c.font={bold:true,size:12,color:{argb:NAVY}}; c.border={bottom:{style:'medium',color:{argb:ACC}}}; ws.getRow(r).height=22; };
    const header=(r,labels)=>{ labels.forEach((t,k)=>{ const c=ws.getCell(r,k+1); c.value=t; c.font={bold:true,color:{argb:WHITE}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; c.alignment={vertical:'middle',horizontal:k===0?'left':'center',wrapText:true}; c.border=border; }); ws.getRow(r).height=22; };
    const cellf=(r,k,v,fmt,opt={})=>{ const c=ws.getCell(r,k); c.value=v; if(fmt) c.numFmt=fmt; c.border=border; c.alignment={vertical:'middle',horizontal:opt.left?'left':'right',indent:opt.left?1:0,wrapText:!!opt.wrap}; c.font={bold:!!opt.bold,color:{argb:opt.color||NAVY},size:opt.size||11}; if(opt.fill) c.fill={type:'pattern',pattern:'solid',fgColor:{argb:opt.fill}}; return c; };
    let r=1;
    band(r++,'CUENTAS TRADING',18,NAVY,WHITE);
    band(r++,'Resumen de '+mLong(mes)+(mes===lastMes()?'  ·  mes en curso':'  ·  mes cerrado'),12,ACC,WHITE);
    ws.mergeCells(r,1,r,NC); ws.getCell(r,1).value='Generado el '+fdate(today())+'. La ganancia de cada socio se reparte según su porcentaje de capital en el mes.'; ws.getCell(r,1).font={italic:true,size:10,color:{argb:MUT}}; ws.getCell(r,1).alignment={indent:1}; r+=2;

    section(r++,'Resumen del mes');
    const sumRows=[['Capital invertido',C,F_COP],['Ganancia del mes (USD)',gUsd,F_USD],[(mes===lastMes()?'TRM vigente':'TRM final')+(te&&te.fecha?' ('+fdate(te.fecha)+')':''),trm,F_TRM],['Ganancia del mes (COP)',gCop,F_COP],['Rendimiento del mes',C>0?gCop/C:0,F_PCT],['Reportes de ganancia',gs.length,'0']];
    sumRows.forEach(([l,v,f],k)=>{ ws.mergeCells(r,1,r,2); cellf(r,1,l,null,{left:true,bold:true,fill:k%2?WHITE:SOFT}); ws.getCell(r,2).border=border; cellf(r,3,v,f,{bold:true,fill:k%2?WHITE:SOFT,color:(l.startsWith('Ganancia')||l.startsWith('Rend'))?POS:NAVY}); r++; });
    r++;

    section(r++,'Socios');
    header(r++,['Socio','Capital invertido','Porcentaje','Ganancia (COP)','Ganancia (USD)','','']); ws.mergeCells(r-1,5,r-1,7);
    const first=r;
    ns.forEach((n,k)=>{
      const fill=k%2?WHITE:SOFT, cap=P[n];
      cellf(r,1,n.toUpperCase(),null,{left:true,bold:true,fill});
      cellf(r,2,cap,F_COP,{fill});
      cellf(r,3,{formula:'B'+r+'/$B$'+(first+ns.length),result:C>0?cap/C:0},F_PCT,{fill});
      cellf(r,4,parts[n]||0,F_COP,{fill,color:POS,bold:true});
      ws.mergeCells(r,5,r,7); cellf(r,5,partsUsd[n]||0,F_USD,{fill,color:POS});
      r++;
    });
    const last=r-1;
    cellf(r,1,'TOTAL',null,{left:true,bold:true,fill:SOFT});
    cellf(r,2,{formula:`SUM(B${first}:B${last})`,result:C},F_COP,{bold:true,fill:SOFT});
    cellf(r,3,{formula:`SUM(C${first}:C${last})`,result:C>0?1:0},F_PCT,{bold:true,fill:SOFT});
    cellf(r,4,{formula:`SUM(D${first}:D${last})`,result:gCop},F_COP,{bold:true,fill:SOFT,color:POS});
    ws.mergeCells(r,5,r,7); cellf(r,5,{formula:`SUM(E${first}:E${last})`,result:gUsd},F_USD,{bold:true,fill:SOFT,color:POS});
    r+=2;

    section(r++,'Ganancias reportadas');
    if(gs.length){
      header(r++,['#','Fecha','Ganancia (USD)','TRM de ese día','Valor a TRM '+(mes===lastMes()?'vigente':'final'),'Reparto por socio (USD)','']); ws.mergeCells(r-1,6,r-1,7);
      gs.forEach((g,k)=>{
        const fill=k%2?WHITE:SOFT;
        cellf(r,1,'Reporte '+(k+1),null,{left:true,bold:true,fill});
        cellf(r,2,g.fecha?fdate(g.fecha):'',null,{fill});
        cellf(r,3,g.usd||0,F_USD,{fill});
        cellf(r,4,g.trm||0,F_TRM,{fill});
        cellf(r,5,Math.round((g.usd||0)*trm),F_COP,{fill,color:POS,bold:true});
        ws.mergeCells(r,6,r,7);
        cellf(r,6,ns.map(n=>n+': US$'+nf2.format((g.usd||0)*P[n]/C)).join('\n'),null,{left:true,fill,wrap:true,size:10,color:MUT});
        ws.getRow(r).height=Math.max(20,15*ns.length);
        r++;
      });
      cellf(r,1,'TOTAL',null,{left:true,bold:true,fill:SOFT}); cellf(r,2,'',null,{fill:SOFT});
      cellf(r,3,gUsd,F_USD,{bold:true,fill:SOFT}); cellf(r,4,trm,F_TRM,{bold:true,fill:SOFT});
      cellf(r,5,gCop,F_COP,{bold:true,fill:SOFT,color:POS}); ws.mergeCells(r,6,r,7); cellf(r,6,'',null,{fill:SOFT});
      r++;
    } else { ws.mergeCells(r,1,r,NC); cellf(r,1,'Aún no hay reportes de ganancia este mes.',null,{left:true,color:MUT}); r++; }
    r++;

    section(r++,'Movimientos de capital');
    const hist=capHistory(mes);
    if(hist.length){
      header(r++,['Socio','Concepto','','Capital anterior','Capital nuevo','Diferencia','Tipo']);
      ws.mergeCells(r-1,2,r-1,3);
      hist.forEach(({m,a,b,why},k)=>{
        const fill=k%2?WHITE:SOFT;
        cellf(r,1,m.persona.toUpperCase(),null,{left:true,bold:true,fill});
        ws.mergeCells(r,2,r,3); cellf(r,2,why,null,{left:true,fill,wrap:true});
        cellf(r,4,a,F_COP,{fill}); cellf(r,5,b,F_COP,{fill,bold:true});
        cellf(r,6,b-a,'"+$"#,##0;"−$"#,##0',{fill,color:b>a?POS:NEG});
        cellf(r,7,m.tipo==='aporte'?'Aporte':'Retiro',null,{fill,left:true,color:m.tipo==='aporte'?ACC:NEG});
        r++;
      });
    } else { ws.mergeCells(r,1,r,NC); cellf(r,1,'Sin movimientos de capital este mes.',null,{left:true,color:MUT}); r++; }
    r++;
    ws.mergeCells(r,1,r,NC); const ft=ws.getCell(r,1); ft.value='Valores en pesos colombianos (COP). Todas las ganancias del mes se suman en USD y se convierten con la TRM '+(mes===lastMes()?'vigente (la del registro más reciente).':'final del mes.'); ft.font={italic:true,size:9,color:{argb:MUT}}; ft.alignment={indent:1};
    return await wb.xlsx.writeBuffer();
  }
  $('dlBtn').onclick=async()=>{
    const mes=tab; if(!mes||mes==='total') return;
    const b=$('dlBtn'), txt=b.textContent; b.disabled=true; b.textContent='Generando…';
    try{
      if(!isAdmin()){ try{ data=norm(await loadPublic()); }catch(e){} }
      const buf=await buildExcel(mes);
      const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Resumen-Cuentas-Trading-'+mes+'-'+MESES[+mes.slice(5)-1]+'.xlsx';
      document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1500);
      b.textContent='Descargado';
    }catch(e){ b.textContent='No se pudo generar. Intenta de nuevo.'; }
    setTimeout(()=>{ b.disabled=false; render(); },1800);
  };

  /* ---------- entrar / salir ---------- */
  $('adminLink').onclick=()=>{ $('login').hidden=false; $('lRepo').value=LS.get('gh_repo')||guessRepo()||''; ($('lRepo').value?$('lToken'):$('lRepo')).focus(); };
  $('lGo').onclick=async()=>{
    const m=$('lMsg'), r=$('lRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''), t=$('lToken').value.trim();
    if(!/^[\w.-]+\/[\w.-]+$/.test(r)) return flash(m,'Escribe el repositorio como usuario/nombre.',true);
    if(!t) return flash(m,'Pega tu clave de GitHub.',true);
    repo=r; token=t; $('lGo').disabled=true;
    try{
      data=norm(await loadAdmin());
      LS.set('gh_repo',r); LS.set('gh_token',t); $('lToken').value=''; setStatus(''); render();
    }catch(e){
      token=null; flash(m,e.message==='auth'?'La clave no es válida o no tiene acceso a ese repositorio.':e.message==='404'?'No encontré datos.json en ese repositorio.':'No se pudo conectar con GitHub.',true);
    }finally{ $('lGo').disabled=false; }
  };
  $('logout').onclick=()=>{ LS.del('gh_token'); token=null; open=null; setStatus(''); render(); };

  /* ---------- inicio ---------- */
  (async()=>{
    repo=LS.get('gh_repo')||guessRepo(); const t=LS.get('gh_token');
    if(t&&repo){
      token=t;
      try{ data=norm(await loadAdmin()); setStatus(''); render(); return; }
      catch(e){ token=null; LS.del('gh_token'); }
    }
    try{ data=norm(await loadPublic()); setStatus(''); }
    catch(e){ $('status').textContent='No se pudieron cargar los datos. Recarga la página.'; }
    render();
  })();
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState!=='visible'||isAdmin()) return;
    try{ data=norm(await loadPublic()); render(); }catch(e){}
  });
})();
</script>

</body>
</html>
